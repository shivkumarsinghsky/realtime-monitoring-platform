# Local environment: Mosquitto, Redis, PostgreSQL and the platform components.
#   docker compose up -d --build
#   open http://localhost:8000
# Optional Kafka bus instead of Redis Streams: docker compose --profile kafka up -d and set BUS=kafka.
# Credentials are local development values only.

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment: &env
    MQTT_HOST: mosquitto
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql://monitoring:monitoring-local-dev@postgres:5432/monitoring
    BUS: redis
    PARTITIONS: "4"
    LOG_LEVEL: INFO
  depends_on:
    mosquitto:
      condition: service_started
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["${MQTT_PORT:-1883}:1883"]
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring-local-dev
      POSTGRES_DB: monitoring
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring"]
      interval: 5s
      retries: 10

  ingestion:
    <<: *app
    command: ["ingestion"]

  processor:
    <<: *app
    command: ["processor"]
    environment:
      <<: *env
      PROCESSOR_INDEX: "0"
      PROCESSOR_COUNT: "1"
      CONSUMER_NAME: processor-0

  api:
    <<: *app
    command: ["api"]
    ports: ["${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 5

  prober:
    <<: *app
    command: ["prober"]
    environment:
      <<: *env
      PROBE_TARGETS: api=http://api:8000/health/live
      PROBE_INTERVAL_SECONDS: "10"

  simulator:
    <<: *app
    command: ["simulator", "--host", "mosquitto", "--assets", "5", "--hosts", "3", "--interval", "2", "--anomaly", "PUMP-101"]

  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.8.0
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4

volumes:
  pgdata:
  mqttdata:
